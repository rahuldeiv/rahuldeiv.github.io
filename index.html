<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <meta
      name="description"
      content="Rahul Deivasigamani's personal website is almost ready."
    />
    <title>Rahul Deivasigamani — Coming Soon</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307111f'/%3E%3Cpath d='M18 47V17h13.5c7.2 0 11.5 3.8 11.5 9.8 0 4.2-2.3 7.3-6.1 8.7L46 47h-8.3l-7.4-10.2h-4.8V47H18zm7.5-16.4h5.1c3.2 0 4.8-1.2 4.8-3.7 0-2.4-1.6-3.6-4.8-3.6h-5.1v7.3z' fill='%23f4f7fb'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #07111f;
        color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(circle at 80% 18%, rgba(45, 121, 255, 0.18), transparent 30rem),
          radial-gradient(circle at 10% 90%, rgba(39, 210, 174, 0.1), transparent 28rem),
          #07111f;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        opacity: 0.22;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 4rem 4rem;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
      }

      main {
        display: grid;
        min-height: 100svh;
        padding: clamp(1.5rem, 5vw, 4rem);
        grid-template-rows: auto 1fr auto;
      }

      .name {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .content {
        align-self: center;
        width: min(100%, 58rem);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0 0 1.5rem;
        color: #8da1b8;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 2rem;
        height: 1px;
        content: "";
        background: #4d88ff;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(3.2rem, 10vw, 8.5rem);
        font-weight: 580;
        letter-spacing: -0.065em;
        line-height: 0.94;
        text-wrap: balance;
      }

      .accent {
        color: #72a1ff;
      }

      .status {
        max-width: 31rem;
        margin: clamp(1.75rem, 4vw, 3rem) 0 0;
        color: #a9b7c9;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .progress {
        position: relative;
        width: min(100%, 24rem);
        height: 2px;
        margin-top: 2rem;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }

      .progress::after {
        position: absolute;
        inset: 0;
        width: 42%;
        content: "";
        background: linear-gradient(90deg, #4d88ff, #4fe0c1);
        animation: refine 2.8s ease-in-out infinite alternate;
      }

      footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
        color: #66788d;
        font-size: 0.875rem;
      }

      footer p {
        margin: 0;
      }

      .domain {
        color: #8da1b8;
      }

      @keyframes refine {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(240%);
        }
      }

      @media (max-width: 40rem) {
        footer {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          width: 72%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="name">Rahul Deivasigamani</p>

      <section class="content" aria-labelledby="page-title">
        <p class="eyebrow">Work in progress</p>
        <h1 id="page-title">Website almost <span class="accent">ready.</span></h1>
        <p class="status">
          Fine-tuning the details. Check back soon.
        </p>
        <div class="progress" aria-hidden="true"></div>
      </section>

      <footer>
        <p>&copy; 2026 Rahul Deivasigamani</p>
        <p class="domain">rahuldeiv.com</p>
      </footer>
    </main>
  </body>
</html>
